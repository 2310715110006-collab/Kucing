<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kucu 🐾 Real-time Cloud Game & Album</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka', cursive, sans-serif; }
        video { object-fit: cover; }
        .cat-gradient { background: linear-gradient(135deg, #fff0f5 0%, #ffe4e1 50%, #ffdab9 100%); }
        .card-polaroid { background: #ffffff; box-shadow: 0 8px 25px rgba(244, 114, 182, 0.15); transition: transform 0.3s; }
        .card-polaroid:hover { transform: translateY(-4px) rotate(1deg); }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(0px); }
        }
        @keyframes wag {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(10deg); }
            50% { transform: rotate(0deg); }
            75% { transform: rotate(-10deg); }
            100% { transform: rotate(0deg); }
        }
        .float-anim { animation: float 3s ease-in-out infinite; }
        .wag-anim { display: inline-block; animation: wag 2s ease-in-out infinite; }
    </style>
</head>
<body class="cat-gradient min-h-screen text-slate-800 flex flex-col items-center p-4 pb-12 overflow-x-hidden">

    <!-- Pattern Background -->
    <div class="fixed inset-0 pointer-events-none opacity-5 text-6xl flex justify-around flex-wrap content-around z-[-1]">
        <span>🐾</span><span>🐾</span><span>🐾</span><span>🐾</span><span>🐾</span><span>🐾</span>
    </div>

    <!-- Header App -->
    <header class="w-full max-w-md bg-white/90 backdrop-blur-md rounded-[2rem] p-4 shadow-lg border-2 border-pink-100 mb-5 flex justify-between items-center float-anim">
        <div>
            <h1 class="text-3xl font-bold text-pink-500 flex items-center gap-2">
                <span class="wag-anim">🐱</span> Kucu 
            </h1>
            <p class="text-xs text-orange-400 font-semibold mt-1">Pawis & Meyku Cat Hunter ☁️</p>
        </div>
        <div class="flex flex-col items-end gap-1">
            <div class="flex items-center gap-1.5 bg-emerald-100 text-emerald-600 px-3 py-1.5 rounded-2xl text-[10px] font-extrabold tracking-wide uppercase shadow-sm">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping absolute opacity-75"></span>
                <span class="w-2 h-2 rounded-full bg-emerald-500 relative"></span> Live Sync
            </div>
            <span class="text-[9px] text-slate-400 font-bold">v12.0 2-Tab Engine</span>
        </div>
    </header>

    <!-- PAPAN SKOR REALTIME (Tab 1: Scores) -->
    <section class="w-full max-w-md bg-white rounded-[2rem] p-4 shadow-xl border-4 border-white mb-5 grid grid-cols-2 gap-4 text-center relative overflow-hidden">
        <div class="bg-gradient-to-b from-orange-50 to-pink-50 rounded-3xl p-3 border-2 border-orange-100 shadow-sm relative z-10 transition-transform active:scale-95">
            <span class="text-xs text-orange-500 block font-extrabold uppercase tracking-wide mb-1">Pawis 😼</span>
            <span class="text-3xl font-black text-orange-500 drop-shadow-sm" id="score-pawis">0 <span class="text-sm font-bold text-orange-300">Pts</span></span>
        </div>
        <div class="bg-gradient-to-b from-rose-50 to-pink-50 rounded-3xl p-3 border-2 border-rose-100 shadow-sm relative z-10 transition-transform active:scale-95">
            <span class="text-xs text-rose-500 block font-extrabold uppercase tracking-wide mb-1">Meyku 😻</span>
            <span class="text-3xl font-black text-rose-500 drop-shadow-sm" id="score-meyku">0 <span class="text-sm font-bold text-rose-300">Pts</span></span>
        </div>
    </section>

    <!-- PILIH PEMAIN -->
    <section class="w-full max-w-md bg-white/80 backdrop-blur-sm rounded-3xl p-3 shadow-md border-2 border-pink-100 mb-5">
        <label class="block text-xs font-bold text-slate-500 mb-2 text-center">
            👇 Siapa yang berburu sekarang? 👇
        </label>
        <div class="grid grid-cols-2 gap-3">
            <button id="btn-player-pawis" onclick="selectPlayer('Pawis')" class="py-2.5 rounded-2xl text-sm font-extrabold border-2 transition-all bg-orange-400 text-white border-orange-400 shadow-md">
                Pawis 🙋‍♂️
            </button>
            <button id="btn-player-meyku" onclick="selectPlayer('Meyku')" class="py-2.5 rounded-2xl text-sm font-extrabold border-2 transition-all bg-white text-rose-400 border-rose-200 hover:bg-rose-50 opacity-80">
                Meyku 🙋‍♀️
            </button>
        </div>
    </section>

    <!-- VIEWPORT KAMERA & INPUT -->
    <main class="w-full max-w-md flex-1 flex flex-col items-center">
        <div class="w-full relative aspect-[4/3] bg-slate-900 rounded-[2.5rem] overflow-hidden shadow-2xl border-[6px] border-white mb-4">
            <div id="camera-notice" class="absolute inset-0 flex flex-col items-center justify-center p-4 text-center z-20 bg-slate-800">
                <div class="text-4xl mb-3 animate-pulse">📷</div>
                <p class="text-white font-bold text-sm mb-3" id="status-text">Mencari kamera...</p>
                <button onclick="initCamera()" class="bg-pink-500 hover:bg-pink-600 text-white font-bold text-xs px-5 py-2.5 rounded-full shadow-lg">
                    Nyalakan Kamera 🐾
                </button>
            </div>

            <video id="webcam" autoplay playsinline muted class="w-full h-full object-cover relative z-0"></video>
            <canvas id="canvas" class="hidden"></canvas>

            <div id="ai-loading" class="hidden absolute inset-0 bg-white/95 z-30 flex flex-col items-center justify-center p-4 text-center backdrop-blur-sm">
                <div class="text-6xl mb-3 animate-bounce">🙀</div>
                <p class="text-pink-600 font-extrabold text-lg">Meow! Memproses Foto...</p>
                <p class="text-xs text-slate-500 font-semibold mt-2 bg-pink-100 px-3 py-1 rounded-full">Menyimpan ke Cloud ☁️</p>
            </div>
        </div>

        <div class="w-full relative">
            <span class="absolute left-4 top-3.5 text-lg z-10">💌</span>
            <input type="text" id="note-input" placeholder="Tulis cerita/deskripsi kucing..." class="w-full bg-white border-2 border-pink-100 text-sm font-semibold rounded-[2rem] pl-12 pr-4 py-3.5 mb-4 focus:outline-none focus:border-pink-400 shadow-sm text-slate-700">
        </div>

        <button onclick="captureCat()" class="w-full bg-gradient-to-r from-orange-400 via-pink-500 to-rose-500 active:scale-95 text-white font-black py-4 rounded-[2rem] shadow-xl shadow-pink-300/50 transition-all flex items-center justify-center gap-3 mb-3">
            <span class="text-2xl wag-anim">📸</span>
            <span class="text-base tracking-wide uppercase">Jepret Kucing!</span>
        </button>

        <label class="w-full bg-white/60 backdrop-blur hover:bg-white active:scale-95 text-pink-500 border-2 border-dashed border-pink-300 font-extrabold py-3 rounded-[2rem] text-center text-xs cursor-pointer mb-8 block transition-all">
            📁 Pilih Foto dari Galeri HP
            <input type="file" accept="image/*" capture="environment" id="file-input" class="hidden" onchange="handleFileUpload(event)">
        </label>

        <!-- KOLEKSI ALBUM FOTO KUCING (Tab 2: Gallery) -->
        <section class="w-full bg-white/50 rounded-[2.5rem] p-5 border-2 border-white backdrop-blur-md shadow-lg">
            <div class="flex flex-col gap-3 mb-5">
                <h2 class="text-xl font-black text-pink-600 flex items-center justify-center gap-2">
                    📖 Album Kucu Kita <span class="text-xs font-bold bg-pink-200 text-pink-700 px-2.5 py-0.5 rounded-full" id="total-cats">0 Foto</span>
                </h2>
                
                <!-- Filter Tab Pemain -->
                <div class="flex justify-center gap-2 bg-pink-100/60 p-1.5 rounded-2xl">
                    <button onclick="filterGallery('all')" id="filter-all" class="flex-1 py-1.5 rounded-xl text-xs font-black transition-all bg-white text-pink-500 shadow-sm">Semua</button>
                    <button onclick="filterGallery('Pawis')" id="filter-pawis" class="flex-1 py-1.5 rounded-xl text-xs font-black transition-all text-slate-500">Pawis 😼</button>
                    <button onclick="filterGallery('Meyku')" id="filter-meyku" class="flex-1 py-1.5 rounded-xl text-xs font-black transition-all text-slate-500">Meyku 😻</button>
                </div>
            </div>

            <div id="gallery" class="grid grid-cols-2 gap-4">
                <div class="col-span-2 text-center py-10 bg-white/60 rounded-3xl border-2 border-dashed border-pink-200">
                    <div class="text-4xl mb-2 opacity-50 float-anim">🧶</div>
                    <p class="text-pink-400 text-sm font-bold">Album masih kosong.<br>Ayo mulai berburu! 🐾</p>
                </div>
            </div>
        </section>
    </main>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwqtjF4VGLBZca5Ir2UYqIHpRb-VqmtndYI6DtwD8FZMd34rrzziDaWzudDY3FHNzxM/exec";

        let activePlayer = "Pawis";
        let rawGalleryData = [];
        let currentFilter = "all";

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const statusText = document.getElementById('status-text');
        const aiLoading = document.getElementById('ai-loading');
        const gallery = document.getElementById('gallery');

        function selectPlayer(player) {
            activePlayer = player;
            const btnPawis = document.getElementById('btn-player-pawis');
            const btnMeyku = document.getElementById('btn-player-meyku');

            if (player === 'Pawis') {
                btnPawis.className = "py-2.5 rounded-2xl text-sm font-extrabold border-2 transition-all bg-orange-400 text-white border-orange-400 shadow-md";
                btnMeyku.className = "py-2.5 rounded-2xl text-sm font-extrabold border-2 transition-all bg-white text-rose-400 border-rose-200 hover:bg-rose-50 opacity-80";
            } else {
                btnMeyku.className = "py-2.5 rounded-2xl text-sm font-extrabold border-2 transition-all bg-rose-500 text-white border-rose-500 shadow-md";
                btnPawis.className = "py-2.5 rounded-2xl text-sm font-extrabold border-2 transition-all bg-white text-orange-400 border-orange-200 hover:bg-orange-50 opacity-80";
            }
        }

        async function fetchCloudData() {
            if (!GOOGLE_SCRIPT_URL) return;
            try {
                const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=getData`);
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('score-pawis').innerHTML = `${data.scores.pawis || 0} <span class="text-sm font-bold text-orange-300">Pts</span>`;
                    document.getElementById('score-meyku').innerHTML = `${data.scores.meyku || 0} <span class="text-sm font-bold text-rose-300">Pts</span>`;
                    
                    rawGalleryData = data.gallery || [];
                    document.getElementById('total-cats').innerText = `${rawGalleryData.length} Foto`;
                    renderGallery();
                }
            } catch (e) {
                console.log("Syncing...", e);
            }
        }

        function filterGallery(player) {
            currentFilter = player;
            ['all', 'pawis', 'meyku'].forEach(f => {
                const btn = document.getElementById(`filter-${f}`);
                if (f === player.toLowerCase()) {
                    btn.className = "flex-1 py-1.5 rounded-xl text-xs font-black transition-all bg-white text-pink-500 shadow-sm";
                } else {
                    btn.className = "flex-1 py-1.5 rounded-xl text-xs font-black transition-all text-slate-500";
                }
            });
            renderGallery();
        }

        function renderGallery() {
            gallery.innerHTML = '';
            
            const filtered = rawGalleryData.filter(item => {
                if (currentFilter === 'all') return true;
                return item.player.toLowerCase() === currentFilter.toLowerCase();
            });

            if (filtered.length === 0) {
                gallery.innerHTML = `<div class="col-span-2 text-center py-10 bg-white/60 rounded-3xl border-2 border-dashed border-pink-200">
                    <div class="text-4xl mb-2 opacity-50 float-anim">🧶</div>
                    <p class="text-pink-400 text-sm font-bold">Belum ada foto dalam kategori ini. 🐾</p>
                </div>`;
            } else {
                filtered.forEach(item => {
                    const card = document.createElement('div');
                    card.className = "card-polaroid rounded-[1.5rem] p-3 border-2 border-white flex flex-col justify-between relative overflow-hidden";
                    
                    const playerIcon = item.player.toLowerCase() === 'pawis' ? '😼' : '😻';
                    const playerColor = item.player.toLowerCase() === 'pawis' ? 'text-orange-500' : 'text-rose-500';
                    const badgeBg = item.player.toLowerCase() === 'pawis' ? 'bg-orange-100 text-orange-600' : 'bg-rose-100 text-rose-600';

                    card.innerHTML = `
                        <div class="relative z-10">
                            <div class="relative mb-2">
                                <img src="${item.imgSrc !== '-' ? item.imgSrc : 'https://via.placeholder.com/150?text=Kucu'}" class="w-full aspect-square object-cover rounded-2xl bg-pink-100 shadow-inner" loading="lazy">
                                <span class="absolute -bottom-2 -right-1 bg-gradient-to-r from-emerald-400 to-emerald-500 text-white text-[10px] font-black px-2.5 py-0.5 rounded-full shadow-md border-2 border-white">
                                    +${item.pts} Pts
                                </span>
                            </div>
                            <div class="flex justify-between items-center mb-1 mt-2">
                                <span class="bg-pink-100 text-pink-600 text-[9px] font-extrabold px-2 py-0.5 rounded-full uppercase tracking-wider">${item.tag}</span>
                                <span class="${badgeBg} text-[9px] font-extrabold px-2 py-0.5 rounded-full uppercase">${playerIcon} ${item.player}</span>
                            </div>
                            <p class="text-xs font-black text-slate-800 leading-snug mt-1">${item.label}</p>
                            <p class="text-[10px] font-semibold text-slate-500 mt-1 border-l-2 border-pink-200 pl-1.5 italic">"${item.note}"</p>
                        </div>
                    `;
                    gallery.appendChild(card);
                });
            }
        }

        async function processCatPhoto(imageData) {
            aiLoading.classList.remove('hidden');

            const catTypes = [
                { label: "Kucing Kampung", pts: 50, tag: "🐾 Biasa" },
                { label: "Kucing Oren Barbar", pts: 75, tag: "🍊 Popular" },
                { label: "Kucing Belang Tiga", pts: 100, tag: "✨ Langka" },
                { label: "Kucing Ras Anggora", pts: 150, tag: "👑 Mewah" }
            ];
            
            const result = catTypes[Math.floor(Math.random() * catTypes.length)];
            const noteText = document.getElementById('note-input').value || "Berhasil ditangkap! 🐾";

            const uploadUrl = `${GOOGLE_SCRIPT_URL}?action=addPhoto&player=${encodeURIComponent(activePlayer)}&pts=${result.pts}&label=${encodeURIComponent(result.label)}&tag=${encodeURIComponent(result.tag)}&note=${encodeURIComponent(noteText)}`;

            try {
                const response = await fetch(uploadUrl, {
                    method: 'POST',
                    mode: 'cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: imageData
                });

                const resData = await response.json();

                if (resData.status === "success") {
                    document.getElementById('note-input').value = "";
                    fetchCloudData();
                } else {
                    alert("Gagal: " + resData.message);
                }
            } catch (e) {
                console.error("Upload Error:", e);
                alert("Foto tersimpan ke galeri lokal (Cloud terhubung).");
            } finally {
                aiLoading.classList.add('hidden');
            }
        }

        async function initCamera() {
            try {
                statusText.innerText = "Memuat kamera...";
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' }, audio: false 
                });
                video.srcObject = stream;
                statusText.innerText = "Kamera Siap!";
                document.getElementById('camera-notice').style.display = 'none';
            } catch (err) {
                statusText.innerText = "Kamera terblokir. Gunakan tombol Upload!";
            }
        }

        function captureCat() {
            if (!video.srcObject) {
                alert("Nyalakan kamera atau pakai tombol Pilih Foto Galeri di bawah! 🐾");
                return;
            }

            const context = canvas.getContext('2d');
            canvas.width = 400; 
            canvas.height = 400;
            
            const minDim = Math.min(video.videoWidth, video.videoHeight);
            const startX = (video.videoWidth - minDim) / 2;
            const startY = (video.videoHeight - minDim) / 2;
            
            context.drawImage(video, startX, startY, minDim, minDim, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/jpeg', 0.6); 

            processCatPhoto(imageData);
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const context = canvas.getContext('2d');
                    canvas.width = 400;
                    canvas.height = 400;
                    
                    const minDim = Math.min(img.width, img.height);
                    const startX = (img.width - minDim) / 2;
                    const startY = (img.height - minDim) / 2;

                    context.drawImage(img, startX, startY, minDim, minDim, 0, 0, canvas.width, canvas.height);
                    const imageData = canvas.toDataURL('image/jpeg', 0.6);
                    processCatPhoto(imageData);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        window.addEventListener('DOMContentLoaded', () => {
            initCamera();
            fetchCloudData();
            setInterval(fetchCloudData, 4000);
        });
    </script>
</body>
</html>
