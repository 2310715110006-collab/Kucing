<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kucu Score & Gallery</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; background: #f9f9f9; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
    label { font-weight: bold; display: block; margin-top: 10px; font-size: 14px; }
    input, select, textarea { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
    button { width: 100%; padding: 12px; margin-top: 15px; background: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:disabled { background: #aaa; }
    #preview { max-width: 100%; height: auto; margin-top: 10px; border-radius: 8px; display: none; }
    #status { font-weight: bold; text-align: center; margin-top: 10px; }
  </style>
</head>
<body>

  <h2 style="text-align: center;">Upload Kucu Game</h2>

  <div class="card">
    <label>Pilih Player:</label>
    <select id="playerInput">
      <option value="Pawis">Pawis</option>
      <option value="Meyku">Meyku</option>
    </select>

    <label>Poin (+):</label>
    <input type="number" id="ptsInput" value="10">

    <label>Label Foto:</label>
    <input type="text" id="labelInput" placeholder="Contoh: Kucing Tidur">

    <label>Tag:</label>
    <input type="text" id="tagInput" placeholder="Contoh: Cat">

    <label>Catatan:</label>
    <textarea id="noteInput" placeholder="Keterangan singkat..."></textarea>

    <label>Ambil Foto:</label>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="handleFileSelect(event)">
    <img id="preview" alt="Preview Foto">

    <button id="uploadBtn" onclick="submitData()" disabled>Kirim Foto & Tambah Poin</button>
  </div>

  <p id="status"></p>

  <script>
    // MASUKKAN URL WEB APP APPS SCRIPT KAMU DI SINI
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycb.../exec"; 

    let selectedBase64 = "";

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        selectedBase64 = e.target.result;
        const preview = document.getElementById('preview');
        preview.src = selectedBase64;
        preview.style.display = 'block';
        document.getElementById('uploadBtn').disabled = false;
      };
      reader.readAsDataURL(file);
    }

    async function submitData() {
      const statusText = document.getElementById('status');
      const uploadBtn = document.getElementById('uploadBtn');

      if (!selectedBase64) {
        alert("Silakan jepret foto terlebih dahulu!");
        return;
      }

      statusText.innerText = "Mengirim data ke Google...";
      statusText.style.color = "#007bff";
      uploadBtn.disabled = true;

      // 1. Masukkan semua metadata ke URL Parameter
      const params = new URLSearchParams({
        action: "addPhoto",
        player: document.getElementById('playerInput').value,
        pts: document.getElementById('ptsInput').value,
        label: document.getElementById('labelInput').value || "Kucing",
        tag: document.getElementById('tagInput').value || "General",
        note: document.getElementById('noteInput').value || "-"
      });

      const fullUrl = `${SCRIPT_URL}?${params.toString()}`;

      try {
        // 2. Kirim Request
        const response = await fetch(fullUrl, {
          method: "POST",
          mode: "cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: selectedBase64 // File foto mentah Base64 di Body
        });

        const result = await response.json();

        if (result.status === "success") {
          statusText.innerText = "Berhasil! Poin bertambah & foto tersimpan di Sheet.";
          statusText.style.color = "green";
          document.getElementById('preview').style.display = 'none';
          document.getElementById('labelInput').value = "";
          document.getElementById('noteInput').value = "";
          selectedBase64 = "";
        } else {
          statusText.innerText = "Gagal: " + result.message;
          statusText.style.color = "red";
          uploadBtn.disabled = false;
        }
      } catch (err) {
        console.error("Error:", err);
        statusText.innerText = "Terjadi kesalahan koneksi.";
        statusText.style.color = "red";
        uploadBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
