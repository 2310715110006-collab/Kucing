<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kucu 🐾 Real-time Cloud Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka', cursive, sans-serif; }
        video { object-fit: cover; }
        .pink-gradient { background: linear-gradient(135deg, #fce7f3 0%, #ffd1dc 100%); }
        .card-polaroid { background: #ffffff; box-shadow: 0 4px 15px rgba(244, 114, 182, 0.2); }
    </style>
</head>
<body class="pink-gradient min-h-screen text-slate-800 flex flex-col items-center p-4 pb-12">

    <!-- Header -->
    <header class="w-full max-w-md bg-white/80 backdrop-blur-md rounded-3xl p-4 shadow-sm border border-pink-200 mb-4 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold text-pink-500 flex items-center gap-1">
                🐾 Kucu <span class="text-xs text-pink-300 font-normal">v9.0 Online</span>
            </h1>
            <p class="text-xs text-pink-400 font-semibold">Game Online Pawis & Meyku ☁️</p>
        </div>
        <div class="flex items-center gap-1 bg-emerald-100 text-emerald-600 px-2.5 py-1 rounded-xl text-[11px] font-bold">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Cloud Live
        </div>
    </header>

    <!-- PAPAN SKOR REALTIME -->
    <section class="w-full max-w-md bg-white rounded-3xl p-4 shadow-md border-2 border-pink-200 mb-4 grid grid-cols-2 gap-3 text-center">
        <div class="bg-pink-50 rounded-2xl p-3 border border-pink-200 shadow-inner">
            <span class="text-xs text-pink-500 block font-bold">Pawis 🙋‍♂️</span>
            <span class="text-3xl font-extrabold text-pink-600" id="score-pawis">0 Pts</span>
        </div>
        <div class="bg-rose-50 rounded-2xl p-3 border border-rose-200 shadow-inner">
            <span class="text-xs text-rose-500 block font-bold">Meyku 🙋‍♀️</span>
            <span class="text-3xl font-extrabold text-rose-600" id="score-meyku">0 Pts</span>
        </div>
    </section>

    <!-- SELEKSI PEMAIN -->
    <section class="w-full max-w-md bg-white/90 rounded-2xl p-3 shadow-sm border border-pink-200 mb-4">
        <label class="block text-xs font-bold text-pink-500 mb-2 text-center">Pilih Pemain Saat Ini:</label>
        <div class="grid grid-cols-2 gap-2">
            <button id="btn-player-pawis" onclick="selectPlayer('Pawis')" class="py-2 rounded-xl text-xs font-bold border-2 transition-all bg-pink-500 text-white border-pink-500 shadow-sm">
                Pawis 🙋‍♂️
            </button>
            <button id="btn-player-meyku" onclick="selectPlayer('Meyku')" class="py-2 rounded-xl text-xs font-bold border-2 transition-all bg-white text-rose-400 border-rose-200 hover:bg-rose-50">
                Meyku 🙋‍♀️
            </button>
        </div>
    </section>

    <!-- Viewport Kamera -->
    <main class="w-full max-w-md flex-1 flex flex-col items-center">
        <div class="relative w-full aspect-[4/3] bg-pink-900/10 rounded-3xl overflow-hidden shadow-md border-4 border-white mb-3">
            <div id="camera-notice" class="absolute inset-0 flex flex-col items-center justify-center p-4 text-center z-0">
                <p class="text-pink-400 text-sm mb-2" id="status-text">Mencari kamera...</p>
                <button onclick="initCamera()" class="bg-pink-400 hover:bg-pink-500 text-white text-xs px-4 py-2 rounded-xl shadow mb-2">
                    Nyalakan Kamera 📷
                </button>
            </div>
            
            <video id="webcam" autoplay playsinline muted class="w-full h-full relative z-10"></video>
            <canvas id="canvas" class="hidden"></canvas>

            <div id="ai-loading" class="hidden absolute inset-0 bg-white/90 z-20 flex flex-col items-center justify-center p-4 text-center">
                <div class="animate-bounce text-4xl mb-2">⚡🐱</div>
                <p class="text-pink-500 font-bold text-sm">Menilai Kucing & Upload ke Cloud...</p>
                <p class="text-xs text-slate-400 mt-1">Foto & Poin otomatis sync ke HP pacar!</p>
            </div>
        </div>

        <input type="text" id="note-input" placeholder="Tulis catatan lucu/romantis... 💌" class="w-full bg-white/90 border border-pink-200 text-sm rounded-2xl px-4 py-2.5 mb-3 focus:outline-none focus:ring-2 focus:ring-pink-300 text-slate-600">

        <!-- Tombol Foto Tunggal -->
        <button onclick="captureCat()" class="w-full bg-gradient-to-r from-pink-500 to-rose-400 active:scale-95 text-white font-bold py-3.5 rounded-2xl shadow-lg transition-all flex items-center justify-center gap-2 mb-2">
            <span class="text-lg">📸</span>
            <span class="text-sm">Tangkap Kucing Cloud</span>
        </button>

        <label class="w-full bg-white hover:bg-pink-50 active:scale-95 text-pink-500 border border-pink-300 font-bold py-2.5 rounded-2xl shadow-sm text-center text-xs cursor-pointer mb-6 block">
            📁 Atau Unggah dari HP
            <input type="file" accept="image/*" capture="environment" id="file-input" class="hidden" onchange="handleFileUpload(event)">
        </label>

        <section class="w-full">
            <h2 class="text-md font-bold text-pink-600 mb-3 flex items-center gap-1">
                📖 Galeri Bersama (Drive Cloud)
            </h2>
            <div id="gallery" class="grid grid-cols-2 gap-3">
                <p class="text-pink-300 text-sm col-span-2 text-center py-6 bg-white/40 rounded-2xl border border-dashed border-pink-200">
                    Belum ada foto tersimpan.<br>Yuk jepret kucing pertama kalian! 🐾
                </p>
            </div>
        </section>
    </main>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyMx4NLWqHMrQddv1qpZHukaEBxANeE-2O1HGCz0tHzK3me-ldVegS9I2OgRPPOKaLG/exec";

        let activePlayer = "Pawis";

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const statusText = document.getElementById('status-text');
        const aiLoading = document.getElementById('ai-loading');
        const gallery = document.getElementById('gallery');

        function selectPlayer(player) {
            activePlayer = player;
            const btnPawis = document.getElementById('btn-player-pawis');
            const btnMeyku = document.getElementById('btn-player-meyku');

            if (player === 'Pawis') {
                btnPawis.className = "py-2 rounded-xl text-xs font-bold border-2 transition-all bg-pink-500 text-white border-pink-500 shadow-sm";
                btnMeyku.className = "py-2 rounded-xl text-xs font-bold border-2 transition-all bg-white text-rose-400 border-rose-200 hover:bg-rose-50";
            } else {
                btnMeyku.className = "py-2 rounded-xl text-xs font-bold border-2 transition-all bg-rose-500 text-white border-rose-500 shadow-sm";
                btnPawis.className = "py-2 rounded-xl text-xs font-bold border-2 transition-all bg-white text-pink-400 border-pink-200 hover:bg-pink-50";
            }
        }

        async function fetchCloudData() {
            if (!GOOGLE_SCRIPT_URL) return;
            try {
                const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=getData`);
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('score-pawis').innerText = `${data.scores.pawis || 0} Pts`;
                    document.getElementById('score-meyku').innerText = `${data.scores.meyku || 0} Pts`;
                    renderGallery(data.gallery);
                }
            } catch (e) {
                console.log("Syncing...", e);
            }
        }

        function renderGallery(galleryList) {
            gallery.innerHTML = '';
            if (!galleryList || galleryList.length === 0) {
                gallery.innerHTML = `<p class="text-pink-300 text-sm col-span-2 text-center py-6 bg-white/40 rounded-2xl border border-dashed border-pink-200">Belum ada foto tersimpan.<br>Yuk jepret kucing pertama kalian! 🐾</p>`;
            } else {
                galleryList.forEach(item => {
                    const card = document.createElement('div');
                    card.className = "card-polaroid rounded-2xl p-2.5 border border-pink-100 flex flex-col justify-between";
                    card.innerHTML = `
                        <div>
                            <div class="relative mb-2">
                                <img src="${item.imgSrc}" class="w-full aspect-square object-cover rounded-xl bg-pink-100" loading="lazy">
                                <span class="absolute top-1.5 right-1.5 bg-white/90 text-pink-600 text-[10px] font-bold px-2 py-0.5 rounded-full shadow-sm">
                                    +${item.pts} Pts
                                </span>
                            </div>
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-[10px] font-bold text-pink-500">${item.tag}</span>
                                <span class="text-[10px] font-semibold text-slate-400">Oleh: ${item.player}</span>
                            </div>
                            <p class="text-xs font-bold text-slate-700 leading-tight mb-1">${item.label}</p>
                            <p class="text-[11px] text-pink-400 italic mb-2">"${item.note}"</p>
                        </div>
                    `;
                    gallery.appendChild(card);
                });
            }
        }

        async function processCatPhoto(imageData) {
            aiLoading.classList.remove('hidden');

            const catTypes = [
                { label: "Kucing Kampung", pts: 50, tag: "🐾 Biasa" },
                { label: "Kucing Oren Barbar", pts: 75, tag: "🍊 Popular" },
                { label: "Kucing Belang Tiga", pts: 100, tag: "✨ Langka" },
                { label: "Kucing Ras Anggora", pts: 150, tag: "👑 Mewah" }
            ];
            
            const result = catTypes[Math.floor(Math.random() * catTypes.length)];
            const noteText = document.getElementById('note-input').value || "Berhasil ditangkap! 🐾";

            const payload = JSON.stringify({
                action: 'addPhoto',
                player: activePlayer,
                image: imageData,
                label: result.label,
                pts: result.pts,
                tag: result.tag,
                note: noteText
            });

            try {
                // Trik Pengiriman Data Tanpa Terblokir CORS Browser:
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: payload
                });

                document.getElementById('note-input').value = "";
                // Beri jeda 3 detik untuk pemprosesan di Apps Script lalu refresh data
                setTimeout(fetchCloudData, 3000);
            } catch (e) {
                alert("Gagal mengunggah foto ke cloud: " + e.message);
            } finally {
                aiLoading.classList.add('hidden');
            }
        }

        async function initCamera() {
            try {
                statusText.innerText = "Memuat kamera...";
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' }, audio: false 
                });
                video.srcObject = stream;
                statusText.innerText = "Kamera Siap!";
            } catch (err) {
                statusText.innerText = "Kamera terblokir. Gunakan tombol 'Unggah dari HP'!";
            }
        }

        async function captureCat() {
            if (!video.srcObject) {
                alert("Kamera browser belum aktif. Silakan gunakan tombol '📁 Atau Unggah dari HP' di bawah!");
                return;
            }

            const context = canvas.getContext('2d');
            canvas.width = 300; 
            canvas.height = 225;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/jpeg', 0.4); 

            processCatPhoto(imageData);
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const context = canvas.getContext('2d');
                    canvas.width = 300;
                    canvas.height = 225;
                    context.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const imageData = canvas.toDataURL('image/jpeg', 0.4);
                    processCatPhoto(imageData);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        window.addEventListener('DOMContentLoaded', () => {
            initCamera();
            fetchCloudData();
            setInterval(fetchCloudData, 4000);
        });
    </script>
</body>
</html>
