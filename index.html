<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kucu Competition v12.0</title>
  <style>
    :root {
      --pink-bg: #fff0f5;
      --pink-main: #ff69b4;
      --pink-dark: #d81b60;
      --pink-soft: #ffe4e1;
      --green-btn: #2ecc71;
      --green-hover: #27ae60;
      --blue-btn: #3498db;
      --blue-hover: #2980b9;
      --text-dark: #4a4a4a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--pink-bg);
      color: var(--text-dark);
      padding: 15px;
      max-width: 450px;
      margin: 0 auto;
    }

    /* HEADER SECTION */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-logo { font-size: 30px; }

    .brand-title h1 {
      font-size: 24px;
      color: var(--pink-main);
      line-height: 1;
      font-weight: 800;
    }

    .brand-title span {
      font-size: 11px;
      color: #aaa;
      font-weight: 600;
    }

    .btn-switch {
      background: #f7e8f0;
      border: 1px solid #e0cbd8;
      border-radius: 12px;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: bold;
      color: #880e4f;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background 0.2s;
    }

    .btn-switch:active { background: #ebd3e3; }

    .player-indicator {
      font-size: 13px;
      font-weight: bold;
      color: var(--pink-main);
      margin-bottom: 14px;
    }

    /* SCOREBOARD SECTION */
    .scoreboard {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }

    .score-card {
      flex: 1;
      background: white;
      border: 2px solid var(--pink-soft);
      border-radius: 20px;
      padding: 14px 10px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(255, 105, 180, 0.08);
    }

    .score-card h3 {
      font-size: 13px;
      color: var(--pink-main);
      margin-bottom: 4px;
    }

    .score-card .pts {
      font-size: 28px;
      font-weight: 800;
      color: var(--pink-main);
    }

    /* ACTION BUTTONS */
    .action-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .btn-action {
      flex: 1;
      border: none;
      border-radius: 14px;
      padding: 12px 6px;
      color: white;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.08);
      transition: transform 0.1s, opacity 0.2s;
    }

    .btn-action:active { transform: scale(0.98); }
    .btn-share { background-color: var(--green-btn); }
    .btn-share:hover { background-color: var(--green-hover); }
    .btn-receive { background-color: var(--blue-btn); }
    .btn-receive:hover { background-color: var(--blue-hover); }

    /* CAMERA DISPLAY BOX */
    .camera-box {
      background: #111;
      border-radius: 16px;
      overflow: hidden;
      width: 100%;
      height: 280px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border: 2px solid var(--pink-soft);
      cursor: pointer;
    }

    #previewImg {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .camera-placeholder {
      position: absolute;
      color: #fff;
      text-align: center;
      pointer-events: none;
    }

    .camera-placeholder span {
      font-size: 36px;
      display: block;
      margin-bottom: 4px;
    }

    .camera-placeholder p {
      font-size: 12px;
      opacity: 0.8;
    }

    /* INPUT NOTE SECTION */
    .note-box {
      background: white;
      border-radius: 16px;
      padding: 10px 14px;
      border: 1.5px solid var(--pink-soft);
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }

    .note-box input {
      width: 100%;
      border: none;
      outline: none;
      font-size: 13px;
      color: #444;
      background: transparent;
    }

    #statusText {
      text-align: center;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 16px;
      min-height: 18px;
    }

    /* GALLERY STREAM */
    .gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .gallery-title {
      font-size: 15px;
      font-weight: bold;
      color: var(--pink-dark);
    }

    .gallery-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .gallery-card {
      background: white;
      border-radius: 16px;
      padding: 12px;
      border: 1.5px solid var(--pink-soft);
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    .gallery-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    .gallery-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: bold;
    }

    .gallery-meta .player-tag {
      color: var(--pink-dark);
      background: var(--pink-bg);
      padding: 3px 8px;
      border-radius: 8px;
    }

    .gallery-meta .pts-tag {
      color: var(--green-btn);
    }

    .gallery-note {
      font-size: 12px;
      color: #666;
      margin-top: 6px;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <div class="brand">
      <div class="brand-logo">🐾</div>
      <div class="brand-title">
        <h1>Kucu</h1>
        <span>v12.0 Competition</span>
      </div>
    </div>
    <button class="btn-switch" onclick="togglePlayer()">🔄 Ganti Pemain</button>
  </div>

  <div class="player-indicator" id="playerDisplay">Pemain: Pawis 💁‍♀️</div>

  <!-- SCOREBOARD -->
  <div class="scoreboard">
    <div class="score-card">
      <h3 id="labelPawis">Pawis 🐾</h3>
      <div class="pts" id="scorePawis">0 Pts</div>
    </div>
    <div class="score-card">
      <h3 id="labelMeyku">Meyku 🐱</h3>
      <div class="pts" id="scoreMeyku">0 Pts</div>
    </div>
  </div>

  <!-- ACTION BUTTONS -->
  <div class="action-buttons">
    <button class="btn-action btn-share" onclick="triggerCamera()">📷 Bagikan Foto</button>
    <button class="btn-action btn-receive" onclick="fetchGameData()">📩 Terima Foto</button>
  </div>

  <input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none" onchange="onFileSelected(event)">

  <!-- CAMERA DISPLAY -->
  <div class="camera-box" onclick="triggerCamera()">
    <img id="previewImg" src="" alt="" style="display:none;">
    <div class="camera-placeholder" id="placeholder">
      <span>📷</span>
      <p>Ketuk untuk jepret foto kucu</p>
    </div>
  </div>

  <!-- NOTE INPUT -->
  <div class="note-box">
    <input type="text" id="noteInput" placeholder="Tulis catatan lucu/romantis... 💌">
  </div>

  <p id="statusText"></p>

  <!-- GALLERY HISTORY -->
  <div class="gallery-header">
    <div class="gallery-title">🖼️ Riwayat Foto Galeri</div>
  </div>

  <div class="gallery-list" id="galleryList">
    <p style="text-align: center; color: #aaa; font-size: 12px;">Memuat galeri...</p>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwqtjF4VGLBZca5Ir2UYqIHpRb-VqmtndYI6DtwD8FZMd34rrzziDaWzudDY3FHNzxM/exec";

    let currentPlayer = "Pawis";
    let base64Image = "";

    function togglePlayer() {
      currentPlayer = (currentPlayer === "Pawis") ? "Meyku" : "Pawis";
      const icon = (currentPlayer === "Pawis") ? "💁‍♀️" : "🙋‍♂️";
      document.getElementById("playerDisplay").innerText = `Pemain: ${currentPlayer} ${icon}`;
    }

    function triggerCamera() {
      document.getElementById("fileInput").click();
    }

    function onFileSelected(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        base64Image = e.target.result;
        const preview = document.getElementById("previewImg");
        const placeholder = document.getElementById("placeholder");
        
        preview.src = base64Image;
        preview.style.display = "block";
        placeholder.style.display = "none";

        sendPhoto();
      };
      reader.readAsDataURL(file);
    }

    async function sendPhoto() {
      const status = document.getElementById("statusText");
      const note = document.getElementById("noteInput").value || "Foto Kucu";

      status.innerText = "⏳ Mengirim foto & memperbarui poin...";
      status.style.color = "#3498db";

      const params = new URLSearchParams({
        action: "addPhoto",
        player: currentPlayer,
        pts: 10,
        label: "Kucu Photo",
        tag: "Competition",
        note: note
      });

      try {
        const res = await fetch(`${SCRIPT_URL}?${params.toString()}`, {
          method: "POST",
          mode: "cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: base64Image
        });

        const data = await res.json();
        if (data.status === "success") {
          status.innerText = "🎉 Berhasil Terkirim & Poin Bertambah!";
          status.style.color = "#2ecc71";
          document.getElementById("noteInput").value = "";
          fetchGameData();
        } else {
          status.innerText = "❌ Gagal: " + data.message;
          status.style.color = "#e74c3c";
        }
      } catch (err) {
        status.innerText = "❌ Terjadi Kesalahan Koneksi";
        status.style.color = "#e74c3c";
      }
    }

    async function fetchGameData() {
      try {
        const res = await fetch(`${SCRIPT_URL}?action=getData`);
        const data = await res.json();

        document.getElementById("scorePawis").innerText = (data.scores.pawis || 0) + " Pts";
        document.getElementById("scoreMeyku").innerText = (data.scores.meyku || 0) + " Pts";

        const list = document.getElementById("galleryList");
        list.innerHTML = "";

        if (data.gallery && data.gallery.length > 0) {
          data.gallery.forEach(item => {
            const card = document.createElement("div");
            card.className = "gallery-card";
            card.innerHTML = `
              <img src="${item.imgSrc !== '-' ? item.imgSrc : 'https://via.placeholder.com/300?text=Foto+Kucu'}" alt="Foto">
              <div class="gallery-meta">
                <span class="player-tag">${item.player}</span>
                <span class="pts-tag">+${item.pts} Pts</span>
              </div>
              <div class="gallery-note">${item.note}</div>
            `;
            list.appendChild(card);
          });
        } else {
          list.innerHTML = '<p style="text-align: center; color: #aaa; font-size: 12px;">Belum ada foto di galeri.</p>';
        }
      } catch (e) {
        console.error(e);
      }
    }

    // Load data awal
    fetchGameData();
  </script>
</body>
</html>
