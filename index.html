<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kucu - Cat Hunter v12.0</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #fff5f5; color: #4a4a4a; text-align: center; padding: 20px; margin: 0; }
    .header { display: flex; justify-content: space-between; align-items: center; max-width: 500px; margin: 0 auto 20px; }
    .title { font-size: 24px; font-weight: bold; color: #d63384; }
    .btn-album { background: #d63384; color: white; border: none; padding: 10px 16px; border-radius: 20px; text-decoration: none; font-weight: bold; font-size: 14px; }
    .score-board { display: flex; justify-content: space-around; max-width: 500px; margin: 0 auto 20px; background: white; padding: 15px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .score-box h3 { margin: 0; font-size: 16px; color: #888; }
    .score-box .pts { font-size: 28px; font-weight: bold; color: #d63384; margin-top: 5px; }
    .card { background: white; padding: 20px; border-radius: 20px; max-width: 500px; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    .preview-box { width: 100%; height: 250px; border: 2px dashed #ffb6c1; border-radius: 15px; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #fafafa; margin-bottom: 15px; }
    .preview-box img { width: 100%; height: 100%; object-fit: cover; }
    input[type="file"], select, input[type="text"] { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
    .btn-submit { background: #28a745; color: white; border: none; width: 100%; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 12px; cursor: pointer; }
    .btn-submit:disabled { background: #ccc; }
    #statusMsg { margin-top: 15px; font-weight: bold; color: #d63384; }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">🐱 Kucu Game</div>
    <a href="gallery.html" class="btn-album">📖 Album 🐾</a>
  </div>

  <div class="score-board">
    <div class="score-box">
      <h3>PAWIS 🐱</h3>
      <div class="pts" id="pawisPts">0 Pts</div>
    </div>
    <div class="score-box">
      <h3>MEYKU 😻</h3>
      <div class="pts" id="meykuPts">0 Pts</div>
    </div>
  </div>

  <div class="card">
    <div class="preview-box" id="previewContainer">
      <span id="placeholderText">Belum ada foto terpilih 📸</span>
      <img id="imgPreview" style="display:none;" />
    </div>

    <input type="file" id="fileInput" accept="image/*" capture="environment" onchange="previewImage(event)">

    <select id="playerSelect">
      <option value="Pawis">Player: Pawis 🐱</option>
      <option value="Meyku">Player: Meyku 😻</option>
    </select>

    <input type="text" id="labelInput" placeholder="Nama Kucing / Label (cth: Kucing Oren)" value="Kucing Lucu">
    
    <select id="tagSelect">
      <option value="🐾 Biasa (+50 Pts)">🐾 Kucing Biasa (+50 Pts)</option>
      <option value="✨ Langka (+100 Pts)">✨ Kucing Langka (+100 Pts)</option>
      <option value="👑 Mitos (+200 Pts)">👑 Kucing Mitos (+200 Pts)</option>
    </select>

    <input type="text" id="noteInput" placeholder="Catatan opsional...">

    <button class="btn-submit" id="btnUpload" onclick="uploadFoto()" disabled>Kirim Foto 🚀</button>
    <div id="statusMsg"></div>
  </div>

  <script>
    // ⚠️ GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT KAMU (/exec)
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycb.../exec";

    let base64ImageData = "";

    // Load Skor Saat Halaman Dibuka
    window.onload = function() {
      fetch(SCRIPT_URL + "?action=getData")
        .then(res => res.json())
        .then(data => {
          if (data.scores) {
            document.getElementById("pawisPts").innerText = data.scores.pawis + " Pts";
            document.getElementById("meykuPts").innerText = data.scores.meyku + " Pts";
          }
        })
        .catch(err => console.error("Gagal muat skor:", err));
    };

    // Preview Foto & Convert ke Base64
    function previewImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          base64ImageData = e.target.result;
          const img = document.getElementById("imgPreview");
          img.src = base64ImageData;
          img.style.display = "block";
          document.getElementById("placeholderText").style.display = "none";
          document.getElementById("btnUpload").disabled = false;
        };
        reader.readAsDataURL(file);
      }
    }

    // Upload Foto ke Google Apps Script Backend
    function uploadFoto() {
      if (!base64ImageData) return alert("Pilih foto terlebih dahulu!");

      const btn = document.getElementById("btnUpload");
      const status = document.getElementById("statusMsg");

      btn.disabled = true;
      status.innerText = "Meow! Memproses & Menyimpan Foto... ☁️";

      const player = document.getElementById("playerSelect").value;
      const label = document.getElementById("labelInput").value || "Kucing";
      const tagChoice = document.getElementById("tagSelect").value;
      const note = document.getElementById("noteInput").value;

      // Hitung Poin berdasarkan Tag
      let pts = 50;
      if (tagChoice.includes("100")) pts = 100;
      if (tagChoice.includes("200")) pts = 200;

      const uploadUrl = SCRIPT_URL + "?action=addPhoto"
        + "&player=" + encodeURIComponent(player)
        + "&pts=" + pts
        + "&label=" + encodeURIComponent(label)
        + "&tag=" + encodeURIComponent(tagChoice)
        + "&note=" + encodeURIComponent(note);

      fetch(uploadUrl, {
        method: "POST",
        body: base64ImageData
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          alert("Berhasil! Foto tersimpan di Album Galeri 🐾");
          window.location.href = "gallery.html"; // Otomatis pindah ke album
        } else {
          alert("Gagal: " + data.message);
          btn.disabled = false;
          status.innerText = "";
        }
      })
      .catch(err => {
        console.error("Error:", err);
        alert("Terjadi kesalahan koneksi saat pengunggahan.");
        btn.disabled = false;
        status.innerText = "";
      });
    }
  </script>
</body>
</html>
