<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kucu 🐾 Pawis & Meyku Scoreboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka', cursive, sans-serif; }
        video { object-fit: cover; }
        .pink-gradient { background: linear-gradient(135deg, #fce7f3 0%, #ffd1dc 100%); }
        .card-polaroid { background: #ffffff; box-shadow: 0 4px 15px rgba(244, 114, 182, 0.2); }
    </style>
</head>
<body class="pink-gradient min-h-screen text-slate-800 flex flex-col items-center p-4 pb-12">

    <!-- Header & Profil -->
    <header class="w-full max-w-md bg-white/80 backdrop-blur-md rounded-3xl p-4 shadow-sm border border-pink-200 mb-4 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold text-pink-500 flex items-center gap-1">
                🐾 Kucu <span class="text-xs text-pink-300 font-normal">v5.5 Reliable</span>
            </h1>
            <p class="text-xs text-pink-400 font-semibold" id="active-user-display">Peran HP Ini: Pawis 🙋‍♂️</p>
        </div>
        <button onclick="switchIdentity()" class="bg-pink-100 active:scale-95 transition-transform text-pink-600 px-3 py-1.5 rounded-2xl text-xs font-bold border border-pink-300 flex items-center gap-1">
            ⚙️ Ubah ID HP
        </button>
    </header>

    <!-- PAPAN SKOR PERSAINGAN LIVE -->
    <section class="w-full max-w-md bg-white rounded-3xl p-4 shadow-md border-2 border-pink-200 mb-4 grid grid-cols-2 gap-3 text-center">
        <div class="bg-pink-50 rounded-2xl p-3 border border-pink-200 shadow-inner">
            <span class="text-xs text-pink-500 block font-bold">Pawis 🙋‍♂️</span>
            <span class="text-3xl font-extrabold text-pink-600" id="score-pawis">0 Pts</span>
        </div>
        <div class="bg-rose-50 rounded-2xl p-3 border border-rose-200 shadow-inner">
            <span class="text-xs text-rose-500 block font-bold">Meyku 🙋‍♀️</span>
            <span class="text-3xl font-extrabold text-rose-600" id="score-meyku">0 Pts</span>
        </div>
    </section>

    <!-- Fitur Manual Share/Receive Foto -->
    <section class="w-full max-w-md grid grid-cols-2 gap-2 mb-4">
        <button onclick="exportGallery()" class="bg-emerald-500 active:scale-95 text-white text-xs font-bold py-2.5 px-3 rounded-2xl shadow-sm flex items-center justify-center gap-1">
            📤 Bagikan Foto
        </button>
        <button onclick="importGallery()" class="bg-indigo-500 active:scale-95 text-white text-xs font-bold py-2.5 px-3 rounded-2xl shadow-sm flex items-center justify-center gap-1">
            📥 Terima Foto
        </button>
    </section>

    <!-- Viewport Kamera -->
    <main class="w-full max-w-md flex-1 flex flex-col items-center">
        <div class="relative w-full aspect-[4/3] bg-pink-900/10 rounded-3xl overflow-hidden shadow-md border-4 border-white mb-3">
            <div id="camera-notice" class="absolute inset-0 flex flex-col items-center justify-center p-4 text-center z-0">
                <p class="text-pink-400 text-sm mb-2" id="status-text">Mencari kamera...</p>
                <button onclick="initCamera()" class="bg-pink-400 hover:bg-pink-500 text-white text-xs px-4 py-2 rounded-xl shadow mb-2">
                    Nyalakan Kamera 📷
                </button>
            </div>
            
            <video id="webcam" autoplay playsinline muted class="w-full h-full relative z-10"></video>
            <canvas id="canvas" class="hidden"></canvas>

            <div id="ai-loading" class="hidden absolute inset-0 bg-white/90 z-20 flex flex-col items-center justify-center p-4 text-center">
                <div class="animate-bounce text-4xl mb-2">⚡🐱</div>
                <p class="text-pink-500 font-bold text-sm">Menilai Kucing & Upload Skor...</p>
                <p class="text-xs text-slate-400 mt-1">Skor tersimpan di papan kompetisi!</p>
            </div>
        </div>

        <input type="text" id="note-input" placeholder="Tulis catatan lucu/romantis... 💌" class="w-full bg-white/90 border border-pink-200 text-sm rounded-2xl px-4 py-2.5 mb-3 focus:outline-none focus:ring-2 focus:ring-pink-300 text-slate-600">

        <button onclick="captureAndAnalyze()" class="w-full bg-gradient-to-r from-pink-400 to-rose-400 active:scale-95 text-white font-bold py-3.5 rounded-2xl shadow-lg transition-all flex items-center justify-center gap-2 mb-2">
            <span class="text-lg">📸 Tangkap Kucing!</span>
        </button>

        <label class="w-full bg-white hover:bg-pink-50 active:scale-95 text-pink-500 border border-pink-300 font-bold py-2.5 rounded-2xl shadow-sm text-center text-xs cursor-pointer mb-6 block">
            📁 Atau Unggah dari HP
            <input type="file" accept="image/*" capture="environment" id="file-input" class="hidden" onchange="handleFileUpload(event)">
        </label>

        <section class="w-full">
            <h2 class="text-md font-bold text-pink-600 mb-3 flex items-center gap-1">
                📖 Galeri Foto HP Ini
            </h2>
            <div id="gallery" class="grid grid-cols-2 gap-3">
                <p class="text-pink-300 text-sm col-span-2 text-center py-6 bg-white/40 rounded-2xl border border-dashed border-pink-200">
                    Belum ada foto tersimpan.<br>Yuk jepret kucing pertama kalian! 🐾
                </p>
            </div>
        </section>
    </main>

    <script>
        const CLOUD_SYNC_URL = "https://keyvalue.impathy.com/api/v1/key";
        let deviceRole = localStorage.getItem('kucu_device_role_v55');

        if (!deviceRole) {
            const chooseRole = confirm("PILIH IDENTITAS HP INI:\n\nKlik 'OK' jika ini HP PAWIS 🙋‍♂️\nKlik 'Cancel' jika ini HP MEYKU 🙋‍♀️");
            deviceRole = chooseRole ? "Pawis" : "Meyku";
            localStorage.setItem('kucu_device_role_v55', deviceRole);
        }

        let galleryData = JSON.parse(localStorage.getItem('kucu_gallery_v55')) || [];

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const statusText = document.getElementById('status-text');
        const aiLoading = document.getElementById('ai-loading');
        const gallery = document.getElementById('gallery');

        function updateRoleUI() {
            document.getElementById('active-user-display').innerText = `Peran HP Ini: ${deviceRole} ${deviceRole === "Pawis" ? '🙋‍♂️' : '🙋‍♀️'}`;
        }

        function switchIdentity() {
            if (confirm("Ubah identitas HP ini?")) {
                deviceRole = deviceRole === "Pawis" ? "Meyku" : "Pawis";
                localStorage.setItem('kucu_device_role_v55', deviceRole);
                updateRoleUI();
                syncLiveBoard();
            }
        }

        async function initCamera() {
            try {
                statusText.innerText = "Memuat kamera...";
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' }, audio: false 
                });
                video.srcObject = stream;
                statusText.innerText = "Kamera Siap!";
            } catch (err) {
                statusText.innerText = "Kamera terblokir. Gunakan tombol 'Unggah dari HP'!";
            }
        }

        // HITUNG TOTAL SKOR PEMAIN HP INI DARI GALERI FOTO
        function calculateMyScore() {
            let total = 0;
            galleryData.forEach(item => {
                if (item.player === deviceRole) {
                    total += item.pts;
                }
            });
            return total;
        }

        // SINKRONKAN SKOR KE CLOUD DENGAN JAMINAN PASTI BERTAMBAH
        async function syncLiveBoard() {
            const myScore = calculateMyScore();
            const myKey = `kucu_v55_score_${deviceRole.toLowerCase()}`;
            const partnerName = deviceRole === "Pawis" ? "meyku" : "pawis";
            const partnerKey = `kucu_v55_score_${partnerName}`;

            // 1. Kirim skor HP ini ke cloud
            try {
                await fetch(`${CLOUD_SYNC_URL}/${myKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: myScore.toString()
                });
            } catch(e) {}

            // 2. Ambil skor lawan dari cloud
            try {
                const res = await fetch(`${CLOUD_SYNC_URL}/${partnerKey}`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.value !== undefined) {
                        localStorage.setItem(`v55_score_${partnerName}`, data.value);
                    }
                }
            } catch(e) {}

            // 3. Update Tampilan Layar
            const pVal = deviceRole === "Pawis" ? myScore : (localStorage.getItem('v55_score_pawis') || 0);
            const mVal = deviceRole === "Meyku" ? myScore : (localStorage.getItem('v55_score_meyku') || 0);

            document.getElementById('score-pawis').innerText = `${pVal} Pts`;
            document.getElementById('score-meyku').innerText = `${mVal} Pts`;
        }

        function loadGallery() {
            gallery.innerHTML = '';
            if (galleryData.length === 0) {
                gallery.innerHTML = `<p class="text-pink-300 text-sm col-span-2 text-center py-6 bg-white/40 rounded-2xl border border-dashed border-pink-200">Belum ada foto. Yuk tangkap kucing! 🐾</p>`;
            } else {
                galleryData.forEach(item => renderCard(item));
            }
            syncLiveBoard();
        }

        function processCatPhoto(imageData) {
            aiLoading.classList.remove('hidden');

            setTimeout(async () => {
                const catTypes = [
                    { label: "Kucing Kampung", pts: 50, tag: "🐾 Biasa" },
                    { label: "Kucing Oren Barbar", pts: 75, tag: "🍊 Popular" },
                    { label: "Kucing Belang Tiga", pts: 100, tag: "✨ Langka" },
                    { label: "Kucing Ras Anggora", pts: 150, tag: "👑 Mewah" }
                ];
                
                const result = catTypes[Math.floor(Math.random() * catTypes.length)];
                const noteText = document.getElementById('note-input').value || "Berhasil ditangkap! 🐾";

                const newItem = {
                    id: Date.now(),
                    imgSrc: imageData,
                    player: deviceRole,
                    label: result.label,
                    pts: result.pts,
                    tag: result.tag,
                    note: noteText,
                    likes: 0
                };

                galleryData.unshift(newItem);
                localStorage.setItem('kucu_gallery_v55', JSON.stringify(galleryData));

                document.getElementById('note-input').value = "";
                aiLoading.classList.add('hidden');
                
                loadGallery();
            }, 800);
        }

        async function captureAndAnalyze() {
            if (!video.srcObject) {
                alert("Kamera browser belum aktif. Silakan gunakan tombol '📁 Atau Unggah dari HP' di bawah!");
                return;
            }

            const context = canvas.getContext('2d');
            canvas.width = 240; 
            canvas.height = 180;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/jpeg', 0.3); 

            processCatPhoto(imageData);
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const context = canvas.getContext('2d');
                    canvas.width = 240;
                    canvas.height = 180;
                    context.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const imageData = canvas.toDataURL('image/jpeg', 0.3);
                    processCatPhoto(imageData);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function renderCard(item) {
            const card = document.createElement('div');
            card.className = "card-polaroid rounded-2xl p-2.5 border border-pink-100 flex flex-col justify-between";
            
            card.innerHTML = `
                <div>
                    <div class="relative mb-2">
                        <img src="${item.imgSrc}" class="w-full aspect-square object-cover rounded-xl">
                        <span class="absolute top-1.5 right-1.5 bg-white/90 text-pink-600 text-[10px] font-bold px-2 py-0.5 rounded-full shadow-sm">
                            +${item.pts} Pts
                        </span>
                    </div>
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-[10px] font-bold text-pink-500">${item.tag}</span>
                        <span class="text-[10px] font-semibold text-slate-400">Oleh: ${item.player}</span>
                    </div>
                    <p class="text-xs font-bold text-slate-700 leading-tight mb-1">${item.label}</p>
                    <p class="text-[11px] text-pink-400 italic mb-2">"${item.note}"</p>
                </div>
                <div class="flex gap-1">
                    <button onclick="addHeart(${item.id})" class="flex-1 bg-pink-50 hover:bg-pink-100 text-pink-500 text-xs font-semibold py-1 rounded-xl flex items-center justify-center gap-1 border border-pink-200">
                        <span>❤️</span> <span>${item.likes || 0}</span>
                    </button>
                    <button onclick="deleteCard(${item.id})" class="bg-rose-50 hover:bg-rose-100 text-rose-500 px-2 py-1 rounded-xl border border-rose-200 text-xs" title="Hapus Foto">
                        🗑️
                    </button>
                </div>
            `;
            gallery.appendChild(card);
        }

        function addHeart(id) {
            const item = galleryData.find(x => x.id === id);
            if (item) {
                item.likes = (item.likes || 0) + 1;
                localStorage.setItem('kucu_gallery_v55', JSON.stringify(galleryData));
                loadGallery();
            }
        }

        function deleteCard(id) {
            if (confirm("Hapus foto ini? Poin kamu akan berkurang! 🐾")) {
                galleryData = galleryData.filter(x => x.id !== id);
                localStorage.setItem('kucu_gallery_v55', JSON.stringify(galleryData));
                loadGallery();
            }
        }

        function exportGallery() {
            if (galleryData.length === 0) {
                alert("Belum ada foto untuk dikirim!");
                return;
            }
            const jsonString = JSON.stringify(galleryData);
            navigator.clipboard.writeText(jsonString).then(() => {
                alert("Kode foto berhasil disalin! 📋\n\nKirimkan teks ini ke WhatsApp pacar kamu, lalu minta ia tekan '📥 Terima Foto'.");
            }).catch(() => {
                prompt("Salin kode foto di bawah ini:", jsonString);
            });
        }

        function importGallery() {
            const inputCode = prompt("Tempelkan (Paste) kode foto dari pacar kamu:");
            if (!inputCode) return;

            try {
                const importedData = JSON.parse(inputCode);
                if (Array.isArray(importedData)) {
                    const existingIds = new Set(galleryData.map(item => item.id));
                    let addedCount = 0;

                    importedData.forEach(item => {
                        if (!existingIds.has(item.id)) {
                            galleryData.push(item);
                            addedCount++;
                        }
                    });

                    galleryData.sort((a, b) => b.id - a.id);
                    localStorage.setItem('kucu_gallery_v55', JSON.stringify(galleryData));
                    loadGallery();

                    alert(`Berhasil menambahkan ${addedCount} foto ke galeri kamu! 🎉`);
                }
            } catch (e) {
                alert("Kode foto tidak valid!");
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            updateRoleUI();
            initCamera();
            loadGallery();
            setInterval(syncLiveBoard, 3000);
        });
    </script>
</body>
</html>
