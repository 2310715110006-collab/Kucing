<head>

    <title>Kucu😼</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        video { object-fit: cover; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center p-4">

    <!-- Header -->
    <header class="w-full max-w-md flex justify-between items-center mb-4">
        <h1 class="text-2xl font-bold text-amber-400">🐱 Kucu</h1>

            <span class="text-xs text-slate-400">Level 1</span>
            <span class="font-bold text-amber-400 ml-1" id="score">0 Pts</span>
        </div>
    </header>

    <!-- Camera Viewport -->
    <main class="w-full max-w-md flex-1 flex flex-col items-center">
        <div class="relative w-full aspect-[4/3] bg-black rounded-2xl overflow-hidden shadow-lg border-2 border-slate-700 mb-4">
            <!-- Notice jika kamera mati -->
            <div id="camera-notice" class="absolute inset-0 flex flex-col items-center justify-center p-4 text-center z-0">
                <p class="text-slate-400 text-sm mb-3" id="status-text">Meminta akses kamera...</p>
                <button onclick="initCamera()" class="bg-slate-700 hover:bg-slate-600 text-xs px-4 py-2 rounded-lg border border-slate-500">
                    Mulai Kamera
                </button>
            </div>
            
            <!-- Video Element -->
            <video id="webcam" autoplay playsinline muted class="w-full h-full relative z-10"></video>
            <canvas id="canvas" class="hidden"></canvas>
        </div>

        <!-- Tombol Foto -->
        <button onclick="takePhoto()" class="w-full bg-amber-500 hover:bg-amber-600 active:scale-95 text-slate-950 font-bold py-3 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 mb-6">
            <span>📷 Tangkap Kucing!</span>
        </button>

        <!-- Galeri Koleksi -->
        <section class="w-full">
            <h2 class="text-lg font-bold mb-3 text-slate-300">Koleksi Kucing</h2>
            <div id="gallery" class="grid grid-cols-2 gap-3">
                <p class="text-slate-500 text-sm col-span-2 text-center py-4">Belum ada kucing yang ditangkap.</p>
            </div>
        </section>
    </main>
