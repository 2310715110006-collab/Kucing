    <!-- Navigasi Bawah -->
    <nav class="bg-white border-t border-gray-100 flex shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-20 pb-safe">

            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />

            </svg>
            <span class="text-[11px] font-bold tracking-wide uppercase">Cat-dex</span>
        </button>
    </nav>

    <!-- Modul JS untuk Firebase dan Gemini -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 1. Setup Firebase & Path
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'cat-dex-local';
        let firebaseConfig = {};
        if (typeof __firebase_config !== 'undefined') {
            firebaseConfig = JSON.parse(__firebase_config);
        }

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        let catsRef;
        let currentUser = null;
        let videoStream = null;
        
        // Element DOM
        const video = document.getElementById('video-feed');
        const canvas = document.getElementById('canvas');
        const snapBtn = document.getElementById('snap-btn');
        const tabCamera = document.getElementById('camera-tab');
        const tabCatdex = document.getElementById('catdex-tab');
        const navCamera = document.getElementById('nav-camera');
        const navCatdex = document.getElementById('nav-catdex');
        const catGrid = document.getElementById('cat-grid');
        const emptyState = document.getElementById('empty-state');
        const scoreBadge = document.getElementById('total-score-badge');
        const overlay = document.getElementById('loading-overlay');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-message');
        const toastIcon = document.getElementById('toast-icon');
        
        const catchModal = document.getElementById('catch-modal');
        const modalImg = document.getElementById('modal-img');
        const modalDesc = document.getElementById('modal-desc');
        const modalRarity = document.getElementById('modal-rarity');
        const modalPoints = document.getElementById('modal-points');
        const modalCloseBtn = document.getElementById('modal-close-btn');

        // Autentikasi terlebih dahulu
        async function initApp() {
            try {
                const initialToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                if (initialToken) {
                    await signInWithCustomToken(auth, initialToken);
                } else {
                    await signInAnonymously(auth);
                }
                
                currentUser = auth.currentUser;
                // Path database publik agar kalian berdua bisa melihat koleksi yang sama
                catsRef = collection(db, 'artifacts', appId, 'public', 'data', 'caught_cats');
                
                startCamera();
                listenToCats();
            } catch (error) {
                console.error("Gagal terhubung:", error);
                showToast("Koneksi database gagal.", "❌");
            }
        }

        // 2. Kontrol Kamera
        async function startCamera() {
            if (videoStream) return;
            try {
                // Prioritaskan kamera belakang (environment)
                videoStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' }, 
                    audio: false 
                });
                video.srcObject = videoStream;
            } catch (err) {
                console.error("Akses kamera ditolak:", err);
                showToast("Izin kamera ditolak. Beri akses untuk main ya!", "⚠️");
            }
        }

        function stopCamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
        }

        window.switchTab = function(tabName) {
            if (tabName === 'camera') {
                tabCamera.classList.remove('hidden');
                tabCatdex.classList.add('hidden');
                navCamera.classList.replace('tab-inactive', 'tab-active');
                navCatdex.classList.replace('tab-active', 'tab-inactive');
                startCamera();
            } else {
                tabCamera.classList.add('hidden');
                tabCatdex.classList.remove('hidden');
                navCatdex.classList.replace('tab-inactive', 'tab-active');
                navCamera.classList.replace('tab-active', 'tab-inactive');
            }
        };

        // UI Helpers
        function showToast(message, icon = "ℹ️") {
            toastMsg.textContent = message;
            toastIcon.textContent = icon;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 3000);
        }

        function getRarityColor(rarity) {
            const r = (rarity || '').toLowerCase();
            if(r.includes('epic') || r.includes('legendary')) return 'bg-yellow-500';
            if(r.includes('rare') || r.includes('langka')) return 'bg-purple-500';
            return 'bg-green-500'; 
        }

        // 3. AI Analisis Foto (Gemini)
        async function analyzeWithGemini(base64Data) {
            const apiKey = ""; // API Key otomatis disediakan oleh Canvas
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
            
            // Perintah untuk AI (Prompt)
            const prompt = `Apakah ada kucing asli atau gambar kucing di foto ini? 
            Jika ya, deskripsikan ciri-cirinya secara singkat dan lucu dalam Bahasa Indonesia (contoh: "Kucing Oren Galak", "Anabul Hitam Putih Tidur").
            Tentukan tingkat kelangkaannya (Common, Rare, Epic).
            Tentukan poinnya (Common=10, Rare=50, Epic=100).
            HANYA berikan balasan dalam format JSON ini:
            {
                "isCat": boolean,
                "description": "string deskripsi",
                "rarity": "string rarity",
                "points": number
            }`;

            const payload = {
                contents: [{
                    parts: [
                        { text: prompt },
                        { inlineData: { mimeType: "image/jpeg", data: base64Data } }
                    ]
                }],
                generationConfig: { responseMimeType: "application/json" }
            };

            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            const result = await response.json();
            if (result.candidates && result.candidates.length > 0) {
                const text = result.candidates[0].content.parts[0].text;
                return JSON.parse(text);
            } else {
                throw new Error("Gagal mendapat respon AI");
            }
        }

        // 4. Proses Foto
        snapBtn.addEventListener('click', async () => {
            if (!videoStream || !currentUser) {
                showToast("Tunggu sebentar, aplikasi belum siap.", "⚠️");
                return;
            }

            // Kompresi ukuran gambar agar tidak memberatkan memori database (Limit Firestore 1MB)
            const MAX_WIDTH = 500;
            const scaleSize = MAX_WIDTH / video.videoWidth;
            canvas.width = MAX_WIDTH;
            canvas.height = video.videoHeight * scaleSize;
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Format JPEG dengan kualitas 60%
            const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
            const base64Raw = dataUrl.split(',')[1];

            overlay.classList.remove('hidden');

            try {
                // Cek gambar pakai AI
                const analysis = await analyzeWithGemini(base64Raw);
                
                if (analysis.isCat) {
                    // Simpan ke Firestore
                    const catData = {
                        image: dataUrl,
                        description: analysis.description || "Kucing Lucu",
                        rarity: analysis.rarity || "Common",
                        points: analysis.points || 10,
                        capturedAt: serverTimestamp()
                    };
                    
                    await addDoc(catsRef, catData);
                    
                    // Tampilkan sukses
                    overlay.classList.add('hidden');
                    modalImg.src = catData.image;
                    modalDesc.textContent = catData.description;
                    modalRarity.textContent = catData.rarity;
                    modalRarity.className = `px-4 py-1.5 rounded-full text-xs font-bold text-white shadow-sm ${getRarityColor(catData.rarity)}`;
                    modalPoints.textContent = `+${catData.points} Pts`;
                    
                    catchModal.classList.remove('hidden');
                    catchModal.classList.add('flex');
                    setTimeout(() => {
                        document.getElementById('catch-modal-content').classList.remove('scale-95');
                        document.getElementById('catch-modal-content').classList.add('scale-100');
                    }, 10);
                    
                } else {
                    overlay.classList.add('hidden');
                    showToast("Ini bukan kucing deh. Coba cari lagi! 😹", "🚫");
                }
            } catch (error) {
                console.error(error);
                overlay.classList.add('hidden');
                showToast("Sensor kucing error. Coba foto lagi!", "🔌");
            }
        });

        modalCloseBtn.addEventListener('click', () => {
            document.getElementById('catch-modal-content').classList.remove('scale-100');
            document.getElementById('catch-modal-content').classList.add('scale-95');
            setTimeout(() => {
                catchModal.classList.add('hidden');
                catchModal.classList.remove('flex');
                switchTab('catdex');
            }, 200);
        });

        // 5. Muat Data Real-time
        function listenToCats() {
            if (!currentUser) return;
            
            const q = query(catsRef); // Simple query, sorting done locally
            
            onSnapshot(q, (snapshot) => {
                const cats = [];
                let totalPts = 0;
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    cats.push({ id: doc.id, ...data });
                    totalPts += (data.points || 0);
                });
                
                // Urutkan dari yang terbaru
                cats.sort((a, b) => (b.capturedAt?.toMillis() || 0) - (a.capturedAt?.toMillis() || 0));

                // Update Poin Atas
                scoreBadge.classList.add('scale-110', 'bg-pink-100');
                setTimeout(() => scoreBadge.classList.remove('scale-110', 'bg-pink-100'), 200);
                scoreBadge.textContent = `${totalPts.toLocaleString()} Pts`;

                // Update Galeri
                catGrid.innerHTML = '';
                if (cats.length === 0) {
                    emptyState.classList.remove('hidden');
                    emptyState.classList.add('flex');
                } else {
                    emptyState.classList.add('hidden');
                    emptyState.classList.remove('flex');
                    
                    cats.forEach(cat => {
                        const rColor = getRarityColor(cat.rarity);
                        const card = document.createElement('div');
                        card.className = "bg-white rounded-2xl shadow-sm border border-pink-100 overflow-hidden flex flex-col transition transform hover:-translate-y-1";
                        card.innerHTML = `
                            <div class="h-32 w-full bg-gray-100 relative">
                                <img src="${cat.image}" alt="Cat" class="w-full h-full object-cover">
                                <div class="absolute top-2 right-2 ${rColor} text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow-sm">
                                    ${cat.rarity || 'Common'}
                                </div>
                            </div>
                            <div class="p-3 flex flex-col gap-1 flex-1 justify-between">
                                <h3 class="font-bold text-gray-800 text-xs leading-tight line-clamp-2">${cat.description}</h3>
                                <div class="flex items-center justify-between mt-2">
                                    <span class="text-[10px] text-pink-600 font-bold bg-pink-50 px-2 py-1 rounded-md border border-pink-100">${cat.points} Pts</span>
                                </div>
                            </div>
                        `;
                        catGrid.appendChild(card);
                    });
                }
            }, (error) => console.error("Error muat data:", error));
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
