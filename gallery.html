<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kucu 🐾 Galeri Foto</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Fredoka', cursive, sans-serif; 
      background: linear-gradient(135deg, #fff0f5 0%, #ffe4e1 50%, #ffdab9 100%);
    }
  </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center pb-12">

  <!-- Header Navigasi -->
  <header class="w-full max-w-md bg-white/90 backdrop-blur-md rounded-[2rem] p-4 shadow-lg border-2 border-pink-100 mb-5 flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold text-pink-500 flex items-center gap-2">
        📸 Galeri Foto Kucu
      </h1>
      <p class="text-xs text-orange-400 font-semibold mt-0.5">Pawis & Meyku Cat Album ☁️</p>
    </div>
    <a href="index.html" class="bg-slate-700 hover:bg-slate-800 text-white text-xs font-extrabold px-4 py-2.5 rounded-2xl shadow-md transition-transform active:scale-95">
      ⬅️ Kamera
    </a>
  </header>

  <!-- Container Grid Foto -->
  <main class="w-full max-w-md">
    <div id="loading" class="text-center text-pink-500 font-bold py-12 animate-pulse">
      Memuat foto dari Drive... 🐾
    </div>
    
    <div id="photoGrid" class="grid grid-cols-2 gap-3 hidden"></div>
  </main>

  <script>
    // URL Web App Deployment Google Apps Script milikmu
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwqtjF4VGLBZca5Ir2UYqIHpRb-VqmtndYI6DtwD8FZMd34rrzziDaWzudDY3FHNzxM/exec";

    window.onload = function() {
      fetch(GOOGLE_SCRIPT_URL + "?action=getData")
        .then(res => res.json())
        .then(data => {
          document.getElementById("loading").style.display = "none";
          const grid = document.getElementById("photoGrid");
          grid.classList.remove("hidden");

          if (!data.gallery || data.gallery.length === 0) {
            grid.innerHTML = `
              <div class="col-span-2 bg-white/80 rounded-3xl p-6 text-center text-slate-400 font-semibold border-2 border-pink-100">
                Belum ada foto. Ambil foto dulu dari kamera! 📸
              </div>
            `;
            return;
          }

          data.gallery.forEach(item => {
            if (!item.imgSrc || item.imgSrc === "-") return;

            // 1. Ekstrak ID File Google Drive dari URL
            let rawUrl = item.imgSrc;
            let fileId = "";
            
            if (rawUrl.includes("/d/")) {
              fileId = rawUrl.split("/d/")[1].split("/")[0].split("?")[0];
            } else if (rawUrl.includes("id=")) {
              fileId = rawUrl.split("id=")[1].split("&")[0];
            }

            // 2. Jalur Utama CDN Google & Jalur Backup (Fallback)
            let primarySrc = fileId ? `https://lh3.googleusercontent.com/d/${fileId}=s600` : rawUrl;
            let fallbackSrc = fileId ? `https://drive.google.com/thumbnail?id=${fileId}&sz=w600` : rawUrl;

            // 3. Render Kartu Foto
            const card = document.createElement("div");
            card.className = "bg-white p-2 rounded-2xl shadow-md border-2 border-white aspect-square overflow-hidden flex items-center justify-center relative group";
            
            card.innerHTML = `
              <img src="${primarySrc}" 
                   alt="Foto Kucu" 
                   class="w-full h-full object-cover rounded-xl"
                   loading="lazy"
                   onerror="if(this.src !== '${fallbackSrc}'){ this.src='${fallbackSrc}'; } else { this.src='https://via.placeholder.com/300?text=Foto+Gagal+Muat'; }">
            `;
            
            grid.appendChild(card);
          });
        })
        .catch(err => {
          console.error("Gagal muat data:", err);
          document.getElementById("loading").innerText = "Gagal terhubung ke Google Drive/Sheet.";
        });
    };
  </script>
</body>
</html>
